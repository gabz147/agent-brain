name: Brain setup
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ['3.13']
        include:
          - os: ubuntu-latest
            python: '3.10'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable optional PDF checks
        run: python -m pip install PyMuPDF==1.28.2
      - name: All workflow and isolated installation tests
        run: python -m unittest discover -s automation/tests -q
      - name: Build brain.pyz twice and run the suite from the bundle
        shell: bash
        run: |
          python tools/build_pyz.py --output dist/brain.pyz
          python tools/build_pyz.py --output dist/again.pyz
          cmp dist/brain.pyz dist/again.pyz
          python dist/brain.pyz test
      - name: Read-only native link audit fixtures
        run: node automation/tests/test_vault_links.mjs
      - name: Official native CLI installers (no login or model calls)
        run: python -c "import install; install.install_client('claude'); install.install_client('codex')"
      - name: Check both real CLIs
        run: python install.py --doctor --client both
      - name: Check POSIX bootstrap syntax
        if: runner.os != 'Windows'
        run: bash -n bootstrap.sh && bash -n get.sh && sh -n bin/brain
      - name: Check PowerShell bootstrap syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          foreach ($script in @('bootstrap.ps1', 'get.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD/$script", [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
